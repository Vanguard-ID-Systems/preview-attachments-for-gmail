<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Mock Gmail compose dock</title>
  <style>
    body { margin: 0; font-family: sans-serif; }
    #reading { padding: 16px; }
    /* Gmail's compose strip (Nov 2026): absolute, full width; windows live in a float:right group. */
    .dw { position: absolute; left: 0; right: 0; bottom: 0; display: flex; z-index: 10; }
    .jvV5Me { flex: 1; }
    .lFFILd { display: flex; margin-left: 56px; margin-right: 66px; }
    .lFFILd { justify-content: flex-end; }
    .lFFILd > .nH { margin-left: auto; }
    .no.group { float: right; }
    .nH.nn.win { float: left; position: relative; width: 328px; height: 220px; margin-left: 5px; }
    .nH.nn.win.expanded { width: 80vw; }
    .AD { position: absolute; left: 0; right: 0; bottom: 0; }
    .nH.Hd { background: #fff; box-shadow: 0 0 8px rgba(0,0,0,.4); height: 220px; }
    .hdr { height: 40px; background: #404040; color: #fff; display: flex; align-items: center; padding: 0 12px; }
    .hdr .title { flex: 1; }
    .hdr img, .hdr [role="button"] { width: 24px; height: 24px; display: inline-block; text-align: center; line-height: 24px; cursor: pointer; }
    form { padding: 8px; }
    #inline-reply { margin: 24px; border: 1px solid #ccc; }
  </style>
</head>
<body>
  <div id="reading">
    <h1>Mock Gmail</h1>
    <p>Reading pane content that the compose window used to cover.</p>
    <div id="inline-reply">
      <form method="POST" enctype="multipart/form-data">
        <div role="textbox" contenteditable="true">inline reply</div>
      </form>
    </div>
    <button id="add-compose" type="button">Open another compose</button>
    <button id="expand" type="button">Toggle full-screen on compose 1</button>
    <span id="header-clicks">0</span>
  </div>

  <div class="dw" id="dock">
    <div class="jvV5Me"><div class="nH lFFILd"><div class="nH">
      <div class="no group" id="row">
        <!-- Compose 1: Gmail's real header icon classes (img with alt/aria-label) -->
        <div class="nH nn win" id="compose-1"><div class="no"><div class="nH nn"><div class="AD"><div class="nH">
          <div class="nH Hd" role="dialog">
            <div class="hdr"><span class="title">New Message</span>
              <img class="Hl" alt="Minimize" aria-label="Minimize" role="button" src="data:image/gif;base64,R0lGODlhAQABAAAAACw=">
              <img class="Hq" alt="Full screen" aria-label="Full screen" role="button" src="data:image/gif;base64,R0lGODlhAQABAAAAACw=">
              <img class="Ha" alt="Save &amp; close" aria-label="Save &amp; close" role="button" src="data:image/gif;base64,R0lGODlhAQABAAAAACw=">
            </div>
            <form method="POST" enctype="multipart/form-data">
              <div role="textbox" contenteditable="true">body 1</div>
            </form>
          </div>
        </div></div></div></div></div>
        <!-- Compose 2: generic header buttons only (structural fallback) -->
        <div class="nH nn win" id="compose-2"><div class="no"><div class="nH nn"><div class="AD"><div class="nH">
          <div class="nH Hd" role="dialog">
            <div class="hdr"><span class="title">Re: hello</span>
              <div role="button" aria-label="Minimieren">_</div>
              <div role="button" aria-label="Vollbild">⤢</div>
              <div role="button" aria-label="Schließen">×</div>
            </div>
            <form method="POST" enctype="multipart/form-data">
              <div role="textbox" contenteditable="true">body 2</div>
            </form>
          </div>
        </div></div></div></div></div>
      </div>
    </div></div></div>
  </div>

  <script>
    // Count clicks that reach the header (the extension's button must not let any through).
    document.querySelectorAll('.hdr').forEach((h) => h.addEventListener('click', () => {
      const s = document.getElementById('header-clicks');
      s.textContent = String(Number(s.textContent) + 1);
    }));
    document.querySelectorAll('.hdr').forEach((h) => h.addEventListener('mousedown', () => {
      h.dataset.mousedown = '1';
    }));
    let n = 2;
    document.getElementById('add-compose').addEventListener('click', () => {
      n++;
      const tpl = document.getElementById('compose-1').cloneNode(true);
      tpl.id = 'compose-' + n;
      // Like a Gmail clone: the marker attribute survives but the button is stripped.
      tpl.querySelectorAll('.gcl-toggle').forEach((e) => e.remove());
      document.getElementById('row').appendChild(tpl);
    });
    document.getElementById('expand').addEventListener('click', () => {
      document.getElementById('compose-1').classList.toggle('expanded');
    });
  </script>
  <!-- Same order as manifest.json content_scripts; classic scripts share one scope. -->
  <script src="/src/selectors.js"></script>
  <script src="/src/toggle.js"></script>
  <script src="/src/dock.js"></script>
  <script src="/src/main.js"></script>
</body>
</html>
