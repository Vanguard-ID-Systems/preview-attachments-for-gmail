name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run smoke
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: extension-zip
          path: dist/*.zip

  compose-on-the-left:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: compose-on-the-left-for-gmail
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: compose-on-the-left-for-gmail/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run smoke
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: compose-on-the-left-zip
          path: compose-on-the-left-for-gmail/dist/*.zip
